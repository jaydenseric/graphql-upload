name: CI
on: [push, workflow_dispatch]
jobs:
  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: latest
      - run: npm install
      - run: node --run prettier
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: latest
      - run: npm install
      - run: node --run eslint
  types:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: latest
      - run: npm install
      - run: node --run types
  tests:
    name: Tests
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 20, 22, 24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm install graphql@^16.3.0 --no-save
        if: matrix.node < 22
      - run: npm install
        if: matrix.node >= 22
      - run: node --import ./test-helpers/polyfillFile.mjs --import ./test-helpers/polyfillPromiseWithResolvers.mjs --import ./test-helpers/polyfillRequestBytes.mjs --test --test-reporter=spec
        if: matrix.node < 22
      - run: node --run tests
        if: matrix.node >= 22
